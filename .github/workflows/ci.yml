name: CI Quality Gate

on:
  push:
    branches: [main, "fix/*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: TypeScript, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run CRM, Pricing, Dispatch & Workflow Test Suites
        env:
          COCKPIT_AUTH_SECRET: 'ci-github-actions-secret-key-32chars-min'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder'
        run: npm test

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder'
        run: npm run build
